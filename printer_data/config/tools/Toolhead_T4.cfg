[mcu EBBT4]
canbus_uuid: bb5f8e9823d3

[extruder4]
step_pin: EBBT4:PD0
dir_pin: EBBT4:PD1
enable_pin: !EBBT4:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: EBBT4: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT4: PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder4 TARGET=245"
control=pid
pid_Kp=26.610 
pid_Ki=3.225 
pid_Kd=54.883

max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder4]
uart_pin: EBBT4: PA15
interpolate: False
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[multi_fan T4_partfan]
pin: EBBT4:PA1

[heater_fan T4_hotend_fan]
pin: EBBT4:PA0
heater: extruder4
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T4]
variable_color: ""
gcode:
  SELECT_TOOL T=4

[tool T4]
tool_number: 4
extruder: extruder4
fan: multi_fan T4_partfan
params_has_filament_sensor: True
############## GCODE OFFSETS ##############
gcode_x_offset: -1
gcode_y_offset: 0.4
gcode_z_offset: 0.255 #OLD 0.2
params_type: 'sc'
params_sc_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
############## PARK SETTING ##############
params_park_x: 267.60 #266.60
# params_park_y:
# params_park_z:
params_safe_y: 100
params_has_filament_sensor: True

params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 60.1
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 72.3
params_input_shaper_damping_ratio_y: 0.01  

[tool_probe T4]
pin: ^EBBT4:PB6
tool: 4
x_offset: 0
y_offset: 0
z_offset: -0.970
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder4

# [adxl345 T4]
# cs_pin: EBBT4:PB12
# spi_software_sclk_pin: EBBT4:PB10
# spi_software_mosi_pin: EBBT4:PB11
# spi_software_miso_pin: EBBT4:PB2
# axes_map: x,z,y

[neopixel T4_leds]
pin: EBBT4:PD3
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T4_vars]
variable_logo_led_name:         "T4_leds" 
# The name of the addressable LED chain that contains the logo LED(s)
variable_logo_idx:              "3" 
# A comma-separated list of indexes LEDs in the logo
variable_nozzle_led_name:       "T4_leds"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
variable_nozzle_idx:            "1,2"
# A comma-separated list of indexes of LEDs in the nozzle
gcode:
    # This section is required.  Do Not Delete.

[filament_switch_sensor filament_sensor_T4]
switch_pin: EBBT4:PB3
pause_on_runout: False
event_delay: 1.0
pause_delay: 0.1
runout_gcode:
  SET_GCODE_VARIABLE MACRO=EBBT4 VARIABLE=filament_consumed VALUE=1
  _RUNOUT_INIT
insert_gcode:
  M118 T4 reports: Filament Detected
  SET_GCODE_VARIABLE MACRO=EBBT4 VARIABLE=filament_consumed VALUE=0
  _FILAMENT_LOAD_INIT TOOL=4

[gcode_button filament_unload_T4]
pin: EBBT4:PB4 # remove the negation "!" for sensor v1 - use just PA9 as example
press_gcode:  # filament unload procedure   
  _UNLOAD_TANGLE_INIT TOOL=4
release_gcode: # do not add any macro call here

[gcode_macro EBBT4]
variable_active: 0
variable_filament_consumed: 0
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=EBBT4 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder4
    SELECT_TOOL T=4
  {% endif %}

[gcode_macro T4]
variable_realtool: "EBBT4"
variable_backuptool: ""
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
