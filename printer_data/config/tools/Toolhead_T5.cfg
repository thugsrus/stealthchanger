[mcu EBBT5]
canbus_uuid: 2ab2b2523291

# Extruder Example, change as needed. If this is T5, then should be something like extruder1
[extruder5]
step_pin: EBBT5:PD0
dir_pin: EBBT5:PD1
enable_pin: !EBBT5:PD2
microsteps: 16
full_steps_per_rotation: 200 # Single-turn pulse number (200 is 1.8 degrees, 400 is 0.9 degrees)
rotation_distance: 4.637 # Driving pulley circumference mm
nozzle_diameter: 0.600 # Nozzle diameter
filament_diameter: 1.750 # filament diameter
heater_pin: EBBT5: PB13 # Extrusion head heating rod control pin setting (e0)
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT5: PA3 # Extrusion head sensor Pin (T_E0)
max_power: 1.0 # Heating rod PWM maximum output power
min_temp: -50 # Minimum temperature of extruder
max_temp: 310 # Maximum temperature of extruder
min_extrude_temp: 180 # The minimum extrusion temperature of the heating rod (the extruder can only perform extrusion when it reaches this temperature)
pressure_advance: 0.04 # Extruder pressure advance parameter
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder5 TARGET=245"
control=pid
pid_Kp=26.610 
pid_Ki=3.225 
pid_Kd=54.883

max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder5]
uart_pin: EBBT5: PA15
interpolate: False
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0 # Silence threshold (if silence is not required, please change the value to 0)
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

# Change tool number if needed here
[multi_fan T5_partfan]
pin: EBBT5:PA1

# Change tool number if needed here
[heater_fan T5_hotend_fan]
pin: EBBT5:PA0
# Change extruder tool number if needed here
heater: extruder5
heater_temp: 50.0
kick_start_time: 0.5

#Change tool number if needed in the next line, as well ast the last line
[gcode_macro T5]
variable_color: ""
gcode:
  SELECT_TOOL T=5

#change the tool numbers to the tool you are configuring, ie T0, T5, etc
[tool T5]
#change this too
tool_number: 5
#if this were T5, then this would be extruder5, etc
extruder: extruder5
fan: multi_fan T5_partfan
params_has_filament_sensor: True
gcode_x_offset: 0.4
gcode_y_offset: -0.3
gcode_z_offset: 0.250
params_type: 'sc'
#This is the path the tool change takes. Shouldn't have to change it. Unless
#you are using a custom dock
params_sc_path: [{'y':9.5 ,'z':8}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 342.25
params_park_y: 3.5
params_park_z: 351.5
params_safe_y: 100
params_has_filament_sensor: True
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 60.1
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 72.3
params_input_shaper_damping_ratio_y: 0.01  

# Change tool number if needed
[tool_probe T5]
pin: ^EBBT5:PB6
tool: 5
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
z_offset: -1.010
#drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder5

# [adxl345 T5]
# cs_pin: EBBT5:PB12
# spi_software_sclk_pin: EBBT5:PB10
# spi_software_mosi_pin: EBBT5:PB11
# spi_software_miso_pin: EBBT5:PB2
# axes_map: x,z,y

[neopixel T5_leds]
pin: EBBT5:PD3
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.8824
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T5_vars]
variable_logo_led_name:         "T5_leds" 
# The name of the addressable LED chain that contains the logo LED(s)
variable_logo_idx:              "3" 
# A comma-separated list of indexes LEDs in the logo
variable_nozzle_led_name:       "T5_leds"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
variable_nozzle_idx:            "1,2"
# A comma-separated list of indexes of LEDs in the nozzle
gcode:
    # This section is required.  Do Not Delete.

[filament_switch_sensor filament_sensor_T5]
switch_pin: EBBT5:PB3
pause_on_runout: False
event_delay: 1.0
pause_delay: 0.1
runout_gcode:
  SET_GCODE_VARIABLE MACRO=EBBT5 VARIABLE=filament_consumed VALUE=1
  _RUNOUT_INIT
insert_gcode:
  M118 T5 reports: Filament Detected
  SET_GCODE_VARIABLE MACRO=EBBT5 VARIABLE=filament_consumed VALUE=0
  _FILAMENT_LOAD_INIT TOOL=5

[gcode_button filament_unload_T5]
pin: EBBT5:PB4 # remove the negation "!" for sensor v1 - use just PA9 as example
press_gcode:  # filament unload procedure   
  _UNLOAD_TANGLE_INIT TOOL=5
release_gcode: # do not add any macro call here

[gcode_macro EBBT5]
variable_active: 0
variable_filament_consumed: 0
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=EBBT5 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder5
    SELECT_TOOL T=5
  {% endif %}

[gcode_macro T5]
variable_realtool: "EBBT5"
variable_backuptool: ""
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
