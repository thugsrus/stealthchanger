[mcu EBBT2]
canbus_uuid: 7eba7fde40ff

[extruder2]
step_pin: EBBT2:PD0
dir_pin: EBBT2:PD1
enable_pin: !EBBT2:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400 
filament_diameter: 1.750
heater_pin: EBBT2: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT2: PA3 
max_power: 1.0 
min_temp: -50
max_temp: 310 
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
# Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder2 TARGET=245"
control=pid
pid_Kp=31.830
pid_Ki=4.161
pid_Kd=60.874
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder2]
uart_pin: EBBT2: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[multi_fan T2_partfan]
pin: EBBT2:PA1

[heater_fan T2_hotend_fan]
pin: EBBT2:PA0
heater: extruder2
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T2]
variable_color: ""
gcode:
  SELECT_TOOL T=2

[tool T2]
tool_number: 2
extruder: extruder2
fan: multi_fan T2_partfan
############## GCODE OFFSETS ##############
gcode_x_offset: -0.4
gcode_y_offset: -0.2
gcode_z_offset: 1.800 #0.150 #1.5
params_type: 'sc'
params_sc_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
############## PARK OFFSETS ##############
params_park_x: 137.30 #137.50
params_park_y: -1.00
# params_park_z:
params_safe_y: 100
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 31.6
params_input_shaper_damping_ratio_y: 0.01

[tool_probe T2]
pin: ^EBBT2:PB6
tool: 2
x_offset: 0
y_offset: 0
z_offset: 1.320 #Z axis-sensor relative nozzle offset
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2

[adxl345 T2]
cs_pin: EBBT2:PB12
spi_software_sclk_pin: EBBT2:PB10
spi_software_mosi_pin: EBBT2:PB11
spi_software_miso_pin: EBBT2:PB2
axes_map: x,z,y

[neopixel T2_leds]
pin: EBBT2:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.9176
initial_BLUE: 1.0
initial_WHITE: 0.0

[gcode_macro _T2_vars]
variable_logo_led_name:         "T2_leds" 
# The name of the addressable LED chain that contains the logo LED(s)
variable_logo_idx:              "3" 
# A comma-separated list of indexes LEDs in the logo
variable_nozzle_led_name:       "T2_leds"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
variable_nozzle_idx:            "1,2"
# A comma-separated list of indexes of LEDs in the nozzle
gcode:
    # This section is required.  Do Not Delete.