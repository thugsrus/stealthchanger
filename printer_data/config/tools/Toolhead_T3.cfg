[mcu EBBT3]
canbus_uuid: 95bb28dd3652

[extruder3]
step_pin: EBBT3:PD0
dir_pin: EBBT3:PD1
enable_pin: !EBBT3:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBT3: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT3: PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder3 TARGET=245
control=pid
pid_Kp=31.176
pid_Ki=4.949
pid_Kd=49.103
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder3]
uart_pin: EBBT3: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[multi_fan T3_partfan]
pin: EBBT3:PA1

[heater_fan T3_hotend_fan]
pin: EBBT3:PA0
heater: extruder3
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T3]
variable_color: ""
gcode:
  SELECT_TOOL T=3

[tool T3]
tool_number: 3
extruder: extruder3
fan: multi_fan T3_partfan
############## GCODE OFFSETS ##############
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0.330 #0.310
params_type: 'sc'
params_sc_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
############## PARK OFFSETS ##############
params_park_x: 201.90 #201.20
params_park_y: -1.00
# params_park_z:
params_safe_y: 100
# InputShaper
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 32.0
params_input_shaper_damping_ratio_y: 0.01  

[tool_probe T3]
pin: ^EBBT3:PB6
tool: 3
x_offset: 0
y_offset: 0
z_offset: -1.015
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3

[adxl345 T3]
cs_pin: EBBT3:PB12
spi_software_sclk_pin: EBBT3:PB10
spi_software_mosi_pin: EBBT3:PB11
spi_software_miso_pin: EBBT3:PB2
axes_map: x,z,y

[neopixel T3_leds]
pin: EBBT3:PD3
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.749
initial_WHITE: 0.0

#SET_LED LED="T3_leds" RED=1 GREEN=0 BLUE=0.0667 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro _T3_vars]
variable_logo_led_name:         "T3_leds" 
# The name of the addressable LED chain that contains the logo LED(s)
variable_logo_idx:              "3" 
# A comma-separated list of indexes LEDs in the logo
variable_nozzle_led_name:       "T3_leds"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
variable_nozzle_idx:            "1,2"
# A comma-separated list of indexes of LEDs in the nozzle
gcode:
    # This section is required.  Do Not Delete.