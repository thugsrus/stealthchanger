[include pico.cfg]
[include toolmacros.cfg]
[include dynamic.cfg]

[mcu feeder]
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_360051001150533850353920-if00
restart_method: command

[fan_generic exhaust_fan]
pin: feeder:PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.00004 # 25 kHz
hardware_pwm: True

[belay tool0_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool0_feeder
sensor_pin: feeder:PG6
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 0

[belay tool1_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool1_feeder
sensor_pin: feeder:PG10
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 0

[belay tool2_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool2_feeder
sensor_pin:  feeder:PG9
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 0

[belay tool3_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool3_feeder
sensor_pin: feeder:PG13
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 0

[belay tool4_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool4_feeder
sensor_pin: feeder:PG12
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 0

[belay tool5_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool5_feeder
sensor_pin: feeder:PG14
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 0

################################ TOOL T0 ################################

[extruder_stepper _tool0_feeder]
extruder: extruder
step_pin: feeder:PF13
dir_pin:  !feeder:PF12
enable_pin: !feeder:PF14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 21.615
gear_ratio: 50:17

[tmc2209 extruder_stepper _tool0_feeder]
uart_pin: feeder:PC4
run_current: .5
# hold_current: .05
stealthchop_threshold: 250

[filament_switch_sensor filament_sensor_at_tool0]
switch_pin: EBBT0:PB3
pause_on_runout: FALSE 
runout_gcode: 
  M118 T0 reports: Runout
insert_gcode:
  M118 T0 Filament Detected at tool

