[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2350_F7D74F8F71A76B36-if00

########### BUTTON MACROS ################################################

# [gcode_macro _HANDLE_TOOL_BUTTON]
# gcode:
#   {% set T = params.T|int %}
#   {% set S = params.S|default(30)|int %}
#   {% set D = params.D|default(1500)|int %}
#   {% set TEMP = params.TEMP|default(220)|int %}
#   {% set sensor = "filament_switch_sensor filament_sensor_at_tool" ~ T %}

#   {% if printer.virtual_sdcard.is_active %}
#     M118 Printer is printing. Button for T{T} ignored.
#   {% else %}
#     {% if not printer[sensor].filament_detected %}
#       M118 Loading Tool T{T}...
#       M104 S{TEMP} T{params.T}
#       FORCE_MOVE STEPPER="extruder_stepper _tool{params.T}_feeder"  DISTANCE={D} VELOCITY=30 #quick feed to the tool head
#       LOAD_ANY_TOOL_BUTTON T={T} TEMP={TEMP}
#     {% else %}
#       M118 Unloading Tool T{T}...
#       UNLOAD_ANY_TOOL T={T} S={S} D={D} TEMP={TEMP}
#     {% endif %}
#   {% endif %}

[gcode_macro _HANDLE_TOOL_BUTTON]
gcode:
  {% set T = params.T|int %}
  {% set S = params.S|default(30)|int %}
  {% set D = params.D|default(1500)|int %}
  {% set TEMP = params.TEMP|default(220)|int %}
  {% set sensor = "filament_switch_sensor filament_sensor_at_tool" ~ T %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    M118 Printer not homed.
  {% elif not printer.quad_gantry_level.applied %}
    M118 QGL not applied.
  {% elif printer.virtual_sdcard.is_active %}
    M118 Printer is printing. Button for T{T} ignored.
  {% else %}
    {% if not printer[sensor].filament_detected %}
      M118 Loading Tool T{T}...
      M104 S{TEMP} T{params.T}
      FORCE_MOVE STEPPER="extruder_stepper _tool{params.T}_feeder" DISTANCE={D} VELOCITY=30
      LOAD_ANY_TOOL_BUTTON T={T} TEMP={TEMP}
    {% else %}
      M118 Unloading Tool T{T}...
      UNLOAD_ANY_TOOL T={T} S={S} D={D} TEMP={TEMP}
    {% endif %}
  {% endif %}

[gcode_button t0_button]
pin: ^!pico:gpio14
press_gcode: _HANDLE_TOOL_BUTTON T=0 S=30 D=1400

[gcode_button t1_button]
pin: ^!pico:gpio13
press_gcode: _HANDLE_TOOL_BUTTON T=1 S=30 D=1500

[gcode_button t2_button]
pin: ^!pico:gpio12
press_gcode: _HANDLE_TOOL_BUTTON T=2 S=100 D=1500

[gcode_button t3_button]
pin: ^!pico:gpio2
press_gcode: _HANDLE_TOOL_BUTTON T=3 S=30 D=1500

[gcode_button t4_button]
pin: ^!pico:gpio1
press_gcode: _HANDLE_TOOL_BUTTON T=4 S=30 D=1500

[gcode_button t5_button]
pin: ^!pico:gpio0
press_gcode: _HANDLE_TOOL_BUTTON T=5 S=30 D=1500

[gcode_button PRIME1]
pin: ^!pico:gpio3
press_gcode:
  HOME

[gcode_button PRIME2]
pin: ^!pico:gpio15
press_gcode:
  HOME

[gcode_macro HOME]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}

[gcode_macro UNLOAD_ALL_TOOLS]
gcode:
  {% if printer.virtual_sdcard.is_active %}
    M118 Printer is active. Unload aborted.
  {% else %}
    # Loop through tools 0 to 5
    {% for tool_num in range(6) %}
      {% set sensor_name = "filament_switch_sensor filament_sensor_at_tool" ~ tool_num %}
      {% if printer[sensor_name].filament_detected %}
        M118 Unloading Tool {tool_num}...
        UNLOAD_ANY_TOOL T={tool_num} S=30 D=1500
      {% else %}
        M118 Tool {tool_num} empty
      {% endif %}
    {% endfor %}
  {% endif %}

################################## MACROS ##################################
