[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2350_F7D74F8F71A76B36-if00

 ################################## FEEDER BUTTONS ################################## 

[gcode_button t0_button]
pin: ^!pico:gpio14
press_gcode: _HANDLE_TOOL_BUTTON T=0 S=30 D=1300

[gcode_button t1_button]
pin: ^!pico:gpio13
press_gcode: _HANDLE_TOOL_BUTTON T=1 S=30 D=1500

[gcode_button t2_button]
pin: ^!pico:gpio12
press_gcode: _HANDLE_TOOL_BUTTON T=2 S=100 D=1300

[gcode_button t3_button]
pin: ^!pico:gpio2
press_gcode: _HANDLE_TOOL_BUTTON T=3 S=30 D=1300

[gcode_button t4_button]
pin: ^!pico:gpio1
press_gcode: _HANDLE_TOOL_BUTTON T=4 S=30 D=1300

[gcode_button t5_button]
pin: ^!pico:gpio0
press_gcode: _HANDLE_TOOL_BUTTON T=5 S=30 D=1300

[gcode_button PRIME1]
pin: ^!pico:gpio3
press_gcode:
  HOME

[gcode_button PRIME2]
pin: ^!pico:gpio15
press_gcode:
  HOME

[gcode_button TOGGLE_L]
pin: ^!pico:gpio19
press_gcode:
  TOGGLE_FEEDER_SENSORS

[gcode_button TOGGLE_R]
pin: ^pico:gpio4
press_gcode:
  TOGGLE_FEEDER_SENSORS

[gcode_button LOAD_ALL_L]
pin: ^!pico:gpio18
press_gcode:
  # Batch Load All
  BATCH_LOAD_TOOLS

[gcode_button LOAD_ALL_R]
pin: ^!pico:gpio5
press_gcode:
  # Batch Load All
  BATCH_LOAD_TOOLS

################################## MACROS ##################################
[gcode_macro FEED_T0]
gcode:
  _HANDLE_TOOL_BUTTON T=0 S=30 D=1300 TEMP=240

[gcode_macro FEED_T1]
gcode:
  _HANDLE_TOOL_BUTTON T=1 S=30 D=1300 TEMP=240

[gcode_macro FEED_T2]
gcode:
  _HANDLE_TOOL_BUTTON T=2 S=30 D=1300 TEMP=240

[gcode_macro FEED_T3]
gcode:
  _HANDLE_TOOL_BUTTON T=3 S=30 D=1300 TEMP=240

[gcode_macro FEED_T4]
gcode:
  _HANDLE_TOOL_BUTTON T=4 S=30 D=1300 TEMP=240

[gcode_macro FEED_T5]
gcode:
  _HANDLE_TOOL_BUTTON T=5 S=30 D=1300 TEMP=240
