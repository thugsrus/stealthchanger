##################### MACROS #####################

[gcode_macro FILAMENT_FEED]
description: "Feeds filament with FORCE_MOVE until the filament sensor switch triggers"
# Params:
#   T = Tool number
#   S = Speed (mm/s)
#   D = Step distance (mm)
#   MAX = Maximum distance (override)
variable_dist: 10
variable_max_dist: 3000
variable_speed: 100
variable_moved: 0
variable_triggered: 0

gcode:
    {% set T = params.T|default(0)|int %}
    {% set speed = params.S|default(speed)|float %}
    {% set dist = params.D|default(dist)|float %}
    {% set max_dist = params.MAX|default(max_dist)|float %}
    {% set sensor = "filament_switch_sensor filament_sensor_at_tool%s" % T %}

    # Reset state
    SET_GCODE_VARIABLE MACRO=FILAMENT_FEED VARIABLE=moved VALUE=0
    SET_GCODE_VARIABLE MACRO=FILAMENT_FEED VARIABLE=triggered VALUE=0

    RESPOND MSG="Tool {T}: Feeding filament until sensor triggers"
    
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor_at_tool{T}
    {% if printer[sensor].filament_detected %}
        RESPOND MSG="Tool {T}: Filament already at sensor"
        SET_GCODE_VARIABLE MACRO=FILAMENT_FEED VARIABLE=triggered VALUE=1
        {% else %}
            RESPOND MSG="filament not present starting feed loop"
            _FILAMENT_FEED_STEP T={T} S={speed} D={dist} MAX={max_dist}
        {% endif %}    
   
    SET_GCODE_VARIABLE MACRO=FILAMENT_FEED VARIABLE=triggered VALUE=0

[gcode_macro UNLOAD_ANY_TOOL]
description: [T<index>] [S<speed>] [D<distane>]
  Unloads the tool specified with distance and speed
  T= Tool number 
  S= Speed of fast reract in mm/s
  D= Distance (length of bowden tube)
variable_purge:              125 #top of tool head to bottom of nozzle plus purge
variable_bucket_x:            175 #the x location of you purge bucket
variable_bucket_y:            -4 #the y location of your purge bucket
variable_load_temp:           190 # the temp you load and unload filament at   
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}  # checking for homed status 
        RESPOND MSG="Machine not homed. Homing all axes."  
      {% else %}      
        {% if printer.quad_gantry_level.applied|lower == 'false' %} #checking for qgl
            RESPOND MSG="QGL not applied."
           {% else %}
               
               {%  if printer.toolchanger.tool_number != params.T %} #checking to ensure the correct tool is on the shuttle
                  RESPOND MSG="incorrect tool is active: {printer.toolchanger.tool_number}"
                  T{params.T} #swaping to the correct tool
               {% else %}   
                  RESPOND MSG="correct tool"
                  G4 P2000
               {% endif %}

               # # --- Set Tool LED to Red ---
               # {% set led_name = "T" ~ params.T|string ~ "_leds" %}
               # SET_LED LED={led} RED=1.0 GREEN=0.0 BLUE=0 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
               # SET_LED LED={led} RED=0.0 GREEN=0.0 BLUE=0 WHITE=1 INDEX=1 SYNC=0 TRANSMIT=1
               # SET_LED LED={led} RED=0.0 GREEN=0.0 BLUE=0 WHITE=1 INDEX=2 SYNC=0 TRANSMIT=1

               M104 S{load_temp}
               G90 ; Absolute pos
               
               {% if not printer.pause_resume.is_paused %} ; CHECK IF PAUSED BEFORE MOVING TO BUCKET
                  G1 X{bucket_x} Y{bucket_y} Z20 F1800 ; Move over purge bucket
               {% else %}
                  M118 Print is paused: Skipping move to purge bucket.
               {% endif %}
               
               M109 S{load_temp}
               M83                          ; set extruder to relative
               G1 E5 F500                   ; extrude 5 mm
               G1 E-50 F1000                ; retract 5 cm
               G1 E-250 F1000               ; retract 25 cm
               M400                         ; wait for buffer to clear
               FORCE_MOVE STEPPER="extruder_stepper _tool{params.T}_feeder"  DISTANCE=-{params.D} VELOCITY={params.S} #quick feed to the tool head
               
               {% if not printer.pause_resume.is_paused %}
                  CLEAN_NOZZLE
                  M104 S0                       ; Stop heating
               {% endif %}
               
               M118 Tool {params.T} unloaded
               CHECK_SENSORS_STATUS
        {% endif %}
    {% endif %}

[gcode_macro LOAD_ANY_TOOL_BUTTON]
description: [T<index>] [S<speed>] [D<distane>]
    loads the tool specified with distance and speed
    T= Tool number 
    S= Speed of fast reract in mm/s
    D= Distance (length of bowden tube)
variable_purge:              125 #from where you stop the faster feeding to the tip of the nozzle plus a bit for purging
variable_bucket_x:            175 #the x location of you purge bucket
variable_bucket_y:            -4 #the y location of your purge bucket
variable_load_temp:           240 # the temp you load and unload filament at 
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}  # checking for homed status 
        RESPOND MSG="Machine not homed. Homing all axes."  
      {% else %}      
        {% if printer.quad_gantry_level.applied|lower == 'false' %} #checking for qgl
            RESPOND MSG="QGL not applied."
           {% else %}
               
               {%  if printer.toolchanger.tool_number != params.T %} #checking to ensure the correct tool is on the shuttle
                  RESPOND MSG="incorrect tool is active: {printer.toolchanger.tool_number}"
                  T{params.T} #swaping to the correct tool
               {% else %}   
                  RESPOND MSG="correct tool"
               {% endif %}

               # # --- Set Tool LED to Red ---
               # {% set led_name = "T" ~ params.T|string ~ "_leds" %}
               # SET_LED LED={led} RED=1.0 GREEN=0.0 BLUE=0 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
               # SET_LED LED={led} RED=0.0 GREEN=0.0 BLUE=0 WHITE=1 INDEX=1 SYNC=0 TRANSMIT=1
               # SET_LED LED={led} RED=0.0 GREEN=0.0 BLUE=0 WHITE=1 INDEX=2 SYNC=0 TRANSMIT=1
               
               M104 S{load_temp}
               #G4 P2000
               G90 ; Absolute pos
                              
                {% if not printer.pause_resume.is_paused %} ; CHECK IF PAUSED BEFORE MOVING TO  CENTER
                  G1 Y175 F1800 ; Move to center
               {% else %}
                  M118 Print is paused: Skipping move
               {% endif %}

               FILAMENT_FEED T={params.T} S=10 MAX=3000

               {% if not printer.pause_resume.is_paused %} ; CHECK IF PAUSED BEFORE MOVING TO BUCKET
                  G1 X{bucket_x} Y{bucket_y} Z20 F1800 ; Move over purge bucket
               {% else %}
                  M118 Print is paused: Skipping move to purge bucket.
               {% endif %}
               
               M109 S{load_temp}
               M83                           ; set extruder to relative
               G1 E{purge} F300              ; extrude 125mm
               G1 E-5 F1800                  ; retract some
               M82                           ; set extruder to absolute

               {% if not printer.pause_resume.is_paused %}
                  CLEAN_NOZZLE
                  M104 S0                       ; Stop heating
               {% endif %}

               M400                          ; wait for buffer to clear
               M118 Tool {params.T} loaded
               CHECK_SENSORS_STATUS
        {% endif %}
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
# heat nozzle for best results
variable_x1: 157.00  # right of brush 
variable_x2: 120  # left or brush  <<<edit this value>>>
variable_y1: -1   # y value         <<<edit this value>>>
variable_y2: -4
variable_z1: 0.904   # nozzle height   <<<edit this value>>>
gcode:
    M400  ;wait for buffer to clear
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28         ;home axes before travel moves
    {% endif %}

    G90
    G0 Z5 F3600     ;ensure nozzle is above endstop pin
    G0 X{x1} Y{y1}  ;left position
    G0 Z{z1}        ;move down, ready for brushing
    
    M117 Brushing Nozzle
    G0 X{x2} F5000  ;move left
    G0 X{x1}        ;move right
    G0 Y{y2}
    G0 X{x2}        ;move left
    G0 X{x1}        ;move right
    G0 Y{y1}
    G0 X{x2}        ;move left
    G0 X{x1}        ;move right
    G0 Y{y2}
    G0 X{x2}        ;move left
    G0 Z5           ;move up
    G0 X175         ;move right
    G0 Z10 F3600    ;raise nozzle when done
    
    M117 Nozzle Cleaned

######################### FILAMENT COLOR #########################

[delayed_gcode CHECK_FILAMENT_AT_BOOT]
initial_duration: 5.0
gcode:
    CHECK_SENSORS_STATUS

[gcode_macro CHECK_SENSORS_STATUS]
gcode:
    {% for i in range(6) %}
        {% set sensor = "filament_switch_sensor filament_sensor_at_tool" ~ i %}
        {% set led = "T" ~ i ~ "_leds" %}
        
        {% if sensor in printer %}
            {% if printer[sensor].filament_detected %}
                SET_LED LED={led} RED=0.98 GREEN=0 BLUE=1 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
            {% else %}
                SET_LED LED={led} RED=0 GREEN=0.84 BLUE=1 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
            {% endif %}
        {% endif %}
    {% endfor %}

[gcode_macro ACTIVE_TOOLHEAD_COLOR]
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        SET_LED LED="T{tool_number}_leds" RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
    {% endif %}

[gcode_macro ENABLE_ALL_FEEDER_SENSORS]
description: Activates filament sensors 0 through 5
gcode:
    {% for i in range(6) %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_at_feeder{i} ENABLE=1
    {% endfor %}
    M118 AUTO LOAD ENABLED

[gcode_macro DISABLE_ALL_FEEDER_SENSORS]
description: Deactivates filament sensors 0 through 5
gcode:
    {% for i in range(6) %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_at_feeder{i} ENABLE=0
    {% endfor %}
    M118 AUTO LOAD DISABLED

########### BUTTON MACROS ################################################

[gcode_macro _HANDLE_TOOL_BUTTON]
gcode:
  {% set T = params.T|int %}
  {% set S = params.S|default(30)|int %}
  {% set D = params.D|default(1500)|int %}
  {% set TEMP = params.TEMP|default(220)|int %}
  {% set sensor = "filament_switch_sensor filament_sensor_at_tool" ~ T %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    M118 Printer not homed.
  {% elif not printer.quad_gantry_level.applied %}
    M118 QGL not applied.
  {% elif printer.virtual_sdcard.is_active %}
    M118 Printer is printing. Button for T{T} ignored.
  {% else %}
    {% if not printer[sensor].filament_detected %}
      M118 Loading Tool T{T}...
      M104 S{TEMP} T{params.T}
      FORCE_MOVE STEPPER="extruder_stepper _tool{params.T}_feeder" DISTANCE={D} VELOCITY=30
      LOAD_ANY_TOOL_BUTTON T={T} TEMP={TEMP}
    {% else %}
      M118 Unloading Tool T{T}...
      UNLOAD_ANY_TOOL T={T} S={S} D={D} TEMP={TEMP}
    {% endif %}
  {% endif %}
  CHECK_SENSORS_STATUS

[gcode_macro UNLOAD_ALL_TOOLS]
gcode:
  {% if printer.virtual_sdcard.is_active %}
    M118 Printer is active. Unload aborted.
  {% else %}
    # Loop through tools 0 to 5
    {% for tool_num in range(6) %}
      {% set sensor_name = "filament_switch_sensor filament_sensor_at_tool" ~ tool_num %}
      {% if printer[sensor_name].filament_detected %}
        M118 Unloading Tool {tool_num}...
        UNLOAD_ANY_TOOL T={tool_num} S=30 D=1500
        CHECK_SENSORS_STATUS
      {% else %}
        M118 Tool {tool_num} empty
      {% endif %}
    {% endfor %}
  {% endif %}

[gcode_macro TOGGLE_FEEDER_SENSORS]
variable_enabled: 1  # 1 = Enabled, 0 = Disabled
gcode:
    {% if printer["gcode_macro TOGGLE_FEEDER_SENSORS"].enabled == 1 %}
        # Switch to Disabled
        SET_GCODE_VARIABLE MACRO=TOGGLE_FEEDER_SENSORS VARIABLE=enabled VALUE=0
        {% for i in range(6) %}
            SET_FILAMENT_SENSOR SENSOR=filament_sensor_at_feeder{i} ENABLE=0
        {% endfor %}
        M118 Feeder sensors DISABLED.
    {% else %}
        # Switch to Enabled
        SET_GCODE_VARIABLE MACRO=TOGGLE_FEEDER_SENSORS VARIABLE=enabled VALUE=1
        {% for i in range(6) %}
            SET_FILAMENT_SENSOR SENSOR=filament_sensor_at_feeder{i} ENABLE=1
        {% endfor %}
        M118 Feeder sensors ENABLED.
    {% endif %}

[gcode_macro BATCH_LOAD_TOOLS]
description: Homes and loads tools 0-5 only if the printer is NOT printing.
gcode:
    # 1. Check if the printer is currently printing
    {% if printer.idle_timeout.state != "Printing" %}
        M118 Printer idle. Commencing home and batch load...
        HOME
        {% for i in range(6) %}
            {% set feeder_sensor = "filament_sensor_at_feeder" ~ i %}
            {% set tool_sensor = "filament_sensor_at_tool" ~ i %}
            
            # 3. Logic: Feeder occupied AND Tool head empty
            {% if printer["filament_switch_sensor " ~ feeder_sensor].filament_detected and 
                  not printer["filament_switch_sensor " ~ tool_sensor].filament_detected %}
                
                M118 Loading Tool {i}...
                _HANDLE_TOOL_BUTTON T={i} S=30 D=1400
                 CHECK_SENSORS_STATUS
            {% elif printer["filament_switch_sensor " ~ tool_sensor].filament_detected %}
                M118 Tool {i} already loaded, skipping.
            {% else %}
                M118 Tool {i} feeder empty, skipping.
            {% endif %}
        {% endfor %}
    {% else %}
        M118 Printer is currently printing
    {% endif %}
    T0

[gcode_macro DROPOFF_TOOL]
description: Unload tool shuttle
gcode:
    UNSELECT_TOOL