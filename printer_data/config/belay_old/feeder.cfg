################################ TOOL T0 ################################

[extruder_stepper _tool0_feeder]
extruder: extruder
step_pin: feeder:PF13
dir_pin:  !feeder:PF12
enable_pin: !feeder:PF14
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 21.6144
gear_ratio: 50:17

[tmc2209 extruder_stepper _tool0_feeder]
uart_pin: feeder:PC4
run_current: .5
sense_resistor: 0.110
stealthchop_threshold: 0

[filament_switch_sensor filament_sensor_at_tool0]
switch_pin: EBBT0:PB3
pause_on_runout: FALSE 
runout_gcode: 
  M118 T0 reports: Runout
insert_gcode:
  M118 T0 Filament Detected T0
  SET_LED LED="T0_leds" RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1

[filament_switch_sensor filament_sensor_at_feeder0]
switch_pin: ^pico:gpio16
pause_on_runout: FALSE
event_delay: 3.0
runout_gcode: 
  M118 T0 reports: Runout
insert_gcode:
  M118 Filament Detected at Feeder 0
  _HANDLE_TOOL_BUTTON T=0 S=30 D=1300

