[include pico.cfg]
[include toolmacros.cfg]
[include dynamic.cfg]

[mcu feeder]
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_360051001150533850353920-if00
restart_method: command

[neopixel chamber]
pin: feeder:PB0
chain_count: 65
color_order: GRB
initial_GREEN: 0.0
initial_RED: 0.3647
initial_BLUE: 1.0

[fan_generic exhaust_fan]
pin: feeder:PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.00004 # 25 kHz
hardware_pwm: True

[temperature_fan feeder_MCU]
pin: feeder:PA8               # Replace with your fan pin
sensor_type: temperature_mcu # Use 'temperature_host' for Raspberry Pi
sensor_mcu: feeder          # Only if sensor_type is not temperature_host
min_temp: 0
max_temp: 100
target_temp: 45.0        # Target temp in Celsius
max_speed: 1           # Max fan speed (0.0 to 1.0)
min_speed: 0.0           # Min fan speed (0.0 to 1.0)
control: watermark       # Simple on/off around target_temp
max_power: 1.0
kick_start_time: 5.0
cycle_time: 0.00004 # 25 kHz
hardware_pwm: false

# [temperature_sensor feeder]
# sensor_type: temperature_mcu
# sensor_mcu: feeder
# min_temp: 0
# max_temp: 100

# [fan_generic feeder_fan]
# pin: feeder:PA8
# max_power: 1.0
# shutdown_speed: 0.0
# kick_start_time: 5.0
# cycle_time: 0.00004 # 25 kHz
# hardware_pwm: false

[fan_generic feeder_fan_test]
pin: feeder:PD14
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
# cycle_time: 0.00004 # 25 kHz
# hardware_pwm: false

################################ BELAY TOOLS ################################

[belay tool0_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool0_feeder
sensor_pin: feeder:PG6
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 1

[belay tool1_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool1_feeder
