[gcode_macro PRINT_START]
gcode:
    {% set TOOL = params.TOOL | default(-1)| int %}
    {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
    {% set BED_TEMP = params.BED_TEMP | default(0) | int %}

    M117 Initializing...
    INITIALIZE_TOOLCHANGER
    STOP_CRASH_DETECTION
    SET_LED LED="chamber" RED=1 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

    M117 Heating Bed
    M190 S{BED_TEMP}

  {% if params.BED_TEMP|int > 90 %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.25
  {% else %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% endif %}

    SET_LED LED="chamber" RED=0 GREEN=0 BLUE=1 SYNC=0 TRANSMIT=1
    M117 Homing
    G28
    T0
    M109 S150
    M117 Quad Gantry Level
    QUAD_GANTRY_LEVEL
    G28 Z
    SET_DISPLAY_TEXT MSG="Bed mesh"                     # Displays info
    BED_MESH_CALIBRATE                                  # Calibrate the bed mesh
    CARTOGRAPHER_TOUCH TOLERANCE=0.02         # Perform touch probe TOLERANCE=0.08 SPEED=3  
    SET_LED LED="chamber" RED=1 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

  # Preheat all the hotends in use
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
    {% if tooltemp_param in params %}
      M109 T{tool_nr} S{params[tooltemp_param]}
    {% endif %}
  {% endfor %}

  {% if params.TOOL is defined %}
    T{params.TOOL}
  {% endif %}

    NOZZLE_LIGHTS_ON
    SET_LED LED="chamber" RED=0 GREEN=1 BLUE=0 SYNC=0 TRANSMIT=1
    PRIME_LINES INITIAL_TOOL={params.TOOL}
    M109 S{ params.TOOL_TEMP }

    {% if TOOL >= 0 %}
        M104 T0 S0 ; shutdown T0.  If it's up first it will be heated below.
        T{params.TOOL}
        {% set initialToolTemp = 'T' ~ params.TOOL|string ~ '_TEMP' %}
        M117 Waiting on T{params.TOOL} S{params[initialToolTemp]}C
        M109 S{params[initialToolTemp]}
    {% else %}
        M109 S{TOOL_TEMP}
    {% endif %}

    START_CRASH_DETECTION
    SET_LED LED="chamber" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
    M117 Printing

[gcode_macro PRINT_END]
gcode:
    STOP_CRASH_DETECTION
    # SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament
    G91                            ; relative positioning
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    G0 Z{z_safe} F3600             ; move nozzle up

    TURN_OFF_HEATERS
    M107                           ; turn off fan
    M140 S0                        ; turn off bed
    G90                            ; absolute positioning
    {% set tool = printer[printer.toolchanger.tool] %}
    G0 X{tool.params_park_x} Y{tool.params_safe_y} Z300 F3600          ; park nozzle up top
    T0
    M18                            ; Motors off
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1
    START_FAN_TIMER
    PARTFANS_OFF
    M117 Print done
    #SKEW_PROFILE REMOVE=my_skew_profile
    SET_LED LED="chamber" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
    NOZZLE_LIGHTS_OFF

[gcode_macro START_FAN_TIMER]
gcode:
 {% set time = params.TIME|default(1800)|float %}
  UPDATE_DELAYED_GCODE ID=STOP_FAN DURATION={time}

[delayed_gcode STOP_FAN]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro CANCEL_FAN_TIMER]
gcode:
    UPDATE_DELAYED_GCODE ID=STOP_FAN DURATION=0

[gcode_macro TOOLCHANGE_DEMO]
gcode:
    {% for n in range(20) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}

[gcode_macro LOAD_FILAMENT]
variable_ignore_min_extrude_temp: True
gcode:
  M117 Loading
  M104 S240
  G90 ; Absolute pos
  G1 X175 Y0 Z30 F1800 ; Move to center
  M109 S240 ;Heat up the filament
  M83                            ; set extruder to relative
  G1 E50 F300                   ; extrude 5 cm
  G1 E50 F300                   ; extrude 5 cm
  G1 E-4 F1800                  ; retract some
  M82                           ; set extruder to absolute
  M400                          ; wait for buffer to clear
  M104 S0                       ; Stop heating
  M117 Loading done

[gcode_macro UNLOAD_FILAMENT]
variable_ignore_min_extrude_temp: True
gcode:
  M117 Unloading
  M104 S190 ;Heat up the filament
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM=190
  M83                           ; set extruder to relative
  G1 E5 F500                   ; extrude 5 mm
  G1 E-50 F1000                   ; retract 5 cm
  G1 E-50 F1000                   ; retract 5 cm
  M82                            ; set extruder to absolute
  M400                          ; wait for buffer to clear
  TURN_OFF_HEATERS
  M117 Unloading done

## UNSAFE_MOVE_TOOL
## Move the toolhead without homing
########## Parameters ##########
## X: The X distance to move by (default: 0) mm
## Y: The Y distance to move by (default: 0) mm
## Z: The Z distance to move by (default: 0) mm
## F: The feedrate to use (default: 10) mm/s

[gcode_macro UNSAFE_MOVE_TOOL]
#description: Move the toolhead without homing
gcode:
    {% set z = params.Z|default(0)|float %}
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set f = params.F|default(10)|float %}
    G90
    SET_KINEMATIC_POSITION Z={(printer.toolhead.axis_maximum.z/2)} X={(printer.toolhead.axis_maximum.x/2)} Y={(printer.toolhead.axis_maximum.y/2)}
    G0 X{(printer.toolhead.axis_maximum.x/2)+x} Y{(printer.toolhead.axis_maximum.y/2)+y} Z{(printer.toolhead.axis_maximum.z/2)+z} F{ (f*60) }
    M84

[gcode_macro NOZZLE_LIGHTS_ON]
gcode:
    SET_LED LED="T0_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T0_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T1_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T1_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T2_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T2_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T3_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T3_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T4_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T4_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T5_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T5_leds" RED=0 GREEN=0 BLUE=0 WHITE=1 Index=1 SYNC=0 TRANSMIT=1

[gcode_macro NOZZLE_LIGHTS_OFF]
gcode:
    SET_LED LED="T0_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T0_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T1_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T1_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T2_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T2_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T3_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T3_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T4_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T4_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=1 SYNC=0 TRANSMIT=1
    SET_LED LED="T5_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=2 SYNC=0 TRANSMIT=1
    SET_LED LED="T5_leds" RED=0 GREEN=0 BLUE=0 WHITE=0 Index=1 SYNC=0 TRANSMIT=1

    
[gcode_macro PARTFANS_OFF]
gcode:
  SET_FAN_SPEED FAN=T0_partfan SPEED=0
  SET_FAN_SPEED FAN=T1_partfan SPEED=0
  SET_FAN_SPEED FAN=T2_partfan SPEED=0
  SET_FAN_SPEED FAN=T3_partfan SPEED=0
  SET_FAN_SPEED FAN=T4_partfan SPEED=0
  SET_FAN_SPEED FAN=T5_partfan SPEED=0

