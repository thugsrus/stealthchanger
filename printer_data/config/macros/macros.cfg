[gcode_macro PRINT_START]
gcode:
  {% set TOOL = params.TOOL | default(0)| int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}

  SET_LED LED="chamber" RED=1 GREEN=0.27 BLUE=0 SYNC=0 TRANSMIT=1
  SET_GCODE_OFFSET Z=0 ; Reset Z offset
  G28

  M118 Heating Bed {BED_TEMP} 
  M190 S{BED_TEMP}
  {% if BED_TEMP > 90 %}
    # Check if the Cartographer probe is already at or above a stable temperature (e.g., 45C)
    {% if printer["temperature_sensor cartographer_coil"].temperature < 45 %}
      M118 Probe cold ({printer["temperature_sensor cartographer_coil"].temperature|round(1)}C). Heat soaking for 5 mins...
      G4 P300000 ; Pause for 5 minutes
    {% else %}
      M118 Probe already hot ({printer["temperature_sensor cartographer_coil"].temperature|round(1)}C). Skipping heat soak!
    {% endif %}
  {% else %}
    M118 Low bed temp. Skipping probe heat soak...
  {% endif %}

  QUAD_GANTRY_LEVEL
  {% if printer.toolchanger.tool != "T0" %}
    T0
    SET_GCODE_OFFSET Z=0
  {% endif %}
  BED_MESH_CALIBRATE
  G1 X175 Y-1 Z10 F12000
  M109 S150
  CLEAN_NOZZLE
  CARTOGRAPHER_TOUCH_HOME

  ; Switch to the initial printing tool and preheat it.
  {% if TOOL > 0 %}
    M104 T0 S0 ; Shutdown T0.
      T{params.TOOL} ; Switch to the initial printing tool
  {% endif %}
  
  # M109 S{TOOL_TEMP} ; Wait for the tool to reach the target temperature

  # 2. Preheat hotends in use AND turn on their specific LEDs
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
    {% if tooltemp_param in params %}
      M104 T{tool_nr} S{params[tooltemp_param]}
      
      # Set LED for this specific tool to White (Index 1 & 2)
      {% set led_name = "T" ~ tool_nr|string ~ "_leds" %}
      SET_LED LED={led_name} RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=1 SYNC=0 TRANSMIT=1
      SET_LED LED={led_name} RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 SYNC=0 TRANSMIT=1
      SET_LED LED={led_name} RED=0 GREEN=1 BLUE=0 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
    {% endif %}
  {% endfor %}

  # Exhaust Fan 100% speed if over 240, otherwise 30% speed
  {% if TOOL_TEMP > 240 %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.3
  {% else %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
  {% endif %}
  
  SET_LED LED="chamber" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  PRIME_LINES INITIAL_TOOL={params.TOOL}
  

[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%

  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  G92 E0 ; zero the extruder
  G1 E-2.0 F3600 ; retract filament
  M400 ; wait for buffer to clear

  T0 ; Switch to tool 0

  G90 ; absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; move nozzle to remove stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 10} F3600 ; park nozzle at rear

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  M140 S0 ; shutdown bed heater
  M18     ; Motors off
  CHECK_SENSORS_STATUS
  NOZZLE_LIGHTS_OFF
  SET_LED LED="chamber" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  START_FAN_TIMER


[gcode_macro START_FAN_TIMER]
gcode:
 {% set time = params.TIME|default(1800)|float %}
  UPDATE_DELAYED_GCODE ID=STOP_FAN DURATION={time}

[delayed_gcode STOP_FAN]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro CANCEL_FAN_TIMER]
gcode:
    UPDATE_DELAYED_GCODE ID=STOP_FAN DURATION=0

[gcode_macro TOOLCHANGE_DEMO]
gcode:
    {% for n in range(20) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}

######################### FILAMENT COLOR #########################

[delayed_gcode CHECK_FILAMENT_AT_BOOT]
initial_duration: 2.0
gcode:
    CHECK_SENSORS_STATUS

[gcode_macro CHECK_SENSORS_STATUS]
gcode:
  {% for i in range(6) %}
    # Define the exact config name of your sensor
    {% set sensor_name = "filament_sensor_T" ~ i %}
    {% set led = "T" ~ i ~ "_leds" %}
    
    # Check if Klipper recognizes this specific switch sensor namespace
    {% if 'filament_switch_sensor ' ~ sensor_name in printer %}
      # Fetch the object dynamically using bracket notation
      {% set sensor_obj = printer['filament_switch_sensor ' ~ sensor_name] %}
      
      {% if sensor_obj.filament_detected %}
        # Filament present color
        SET_LED LED={led} RED=0.98 GREEN=0 BLUE=1 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
      {% else %}
        # Filament missing color
        SET_LED LED={led} RED=0 GREEN=0.84 BLUE=1 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
      {% endif %}
    {% endif %}
  {% endfor %}

[gcode_macro ACTIVE_TOOLHEAD_COLOR]
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        SET_LED LED="T{tool_number}_leds" RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=3 SYNC=0 TRANSMIT=1
    {% endif %}

######################### UNSAFE_MOVE_TOOL #########################
## Move the toolhead without homing
########## Parameters ##########
## X: The X distance to move by (default: 0) mm
## Y: The Y distance to move by (default: 0) mm
## Z: The Z distance to move by (default: 0) mm
## F: The feedrate to use (default: 10) mm/s

[gcode_macro UNSAFE_MOVE_TOOL]
#description: Move the toolhead without homing
gcode:
    {% set z = params.Z|default(0)|float %}
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set f = params.F|default(10)|float %}
    G90
    SET_KINEMATIC_POSITION Z={(printer.toolhead.axis_maximum.z/2)} X={(printer.toolhead.axis_maximum.x/2)} Y={(printer.toolhead.axis_maximum.y/2)}
    G0 X{(printer.toolhead.axis_maximum.x/2)+x} Y{(printer.toolhead.axis_maximum.y/2)+y} Z{(printer.toolhead.axis_maximum.z/2)+z} F{ (f*60) }
    M84

[gcode_macro NOZZLE_LIGHTS_ON]
gcode:
    {% for i in range(6) %}
        {% set led = "T" ~ i ~ "_leds" %}
        SET_LED LED={led} RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=1 SYNC=0 TRANSMIT=0
        SET_LED LED={led} RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 SYNC=0 TRANSMIT=1
    {% endfor %}

[gcode_macro NOZZLE_LIGHTS_OFF]
gcode:
    {% for i in range(6) %}
        {% set led = "T" ~ i ~ "_leds" %}
        SET_LED LED={led} RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1 SYNC=0 TRANSMIT=0
        SET_LED LED={led} RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2 SYNC=0 TRANSMIT=1
    {% endfor %}
    
[gcode_macro PARTFANS_OFF]
gcode:
    {% for i in range(6) %}
        SET_FAN_SPEED FAN=T{i}_partfan SPEED=0
    {% endfor %}

[gcode_macro PREHEAT_BED_ABS]
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=3600 # Set timeout to 1 hour
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=105

########################################## MAINSAIL VARIABLE ##########################################

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 175.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 300.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 5.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  ; retract speed in mm/s
#variable_unretract        : 1.0   ; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  ; unretract speed in mm/s
#variable_speed_hop        : 15.0  ; z move speed in mm/s
#variable_speed_move       : 100.0 ; move speed in mm/s
#variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
## !!! Custom macros, please use with care and review the section of the corresponding macro.
## These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
## Only  single line commands are supported, please create a macro if you need more than one command.
#variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
#variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
#variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:
