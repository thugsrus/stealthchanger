[include tool_feeder_macros.cfg]

# -----------------------------------------------------------------------------
# MCU
# -----------------------------------------------------------------------------
[mcu feeder]
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_360051001150533850353920-if00

[neopixel chamber]
pin: feeder:PB0
chain_count: 65
color_order: GRB
initial_GREEN: 0.0
initial_RED: 0.3647
initial_BLUE: 1.0

[fan_generic exhaust_fan]
pin: feeder:PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.00004 # 25 kHz
hardware_pwm: True

[temperature_fan feeder_MCU]
pin: feeder:PA8               # Replace with your fan pin
sensor_type: temperature_mcu # Use 'temperature_host' for Raspberry Pi
sensor_mcu: feeder          # Only if sensor_type is not temperature_host
min_temp: 0
max_temp: 100
target_temp: 45.0        # Target temp in Celsius
max_speed: 1           # Max fan speed (0.0 to 1.0)
min_speed: 0.0           # Min fan speed (0.0 to 1.0)
control: watermark       # Simple on/off around target_temp
max_power: 1.0
kick_start_time: 5.0
cycle_time: 0.00004 # 25 kHz
hardware_pwm: false

[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2350_F7D74F8F71A76B36-if00

[gcode_button PRIME1]
pin: ^!pico:gpio3
press_gcode:
  HOME

[gcode_button PRIME2]
pin: ^!pico:gpio15
press_gcode:
  HOME

# -----------------------------------------------------------------------------
# Per-tool steppers, unload buttons, and buffer sync
# -----------------------------------------------------------------------------

# ---- Tool 0 -------------------------------------------------------------

[extruder_stepper _tool0_feeder]
extruder: extruder
step_pin: feeder:PF13
dir_pin:  !feeder:PF12
enable_pin: !feeder:PF14
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 21.6144
gear_ratio: 50:17

[tmc2209 extruder_stepper _tool0_feeder]
uart_pin: feeder:PC4
run_current: .5
sense_resistor: 0.110
stealthchop_threshold: 0

[feeder_buffer T0]
sensor_mode: single
sensor_pin: feeder:PG6
extruder_stepper: _tool0_feeder
multiplier_high: 1.05
multiplier_low: 0.95
debug_console: True
# If debug_console shows it pinned on one state no matter what you do to
# rotation_distance, try invert_sensor: True - see README's "Debugging a
# Buffer" section.
invert_sensor: False

[gcode_button t0_unload_button]
pin: ^!pico:gpio14
press_gcode:
    UPDATE_DELAYED_GCODE ID=_t0_unload_debounce DURATION=0.5

[delayed_gcode _t0_unload_debounce]
gcode:
    UNLOAD_ANY_TOOL T=0 D=1400 S=30  # 1400mm is a reasonable default Bowden length — adjust to match your tube

