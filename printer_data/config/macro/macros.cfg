[gcode_macro TOOLCHANGE_DEMO]
gcode:
    {% for n in range(20) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}

[gcode_macro G32]
gcode:
    _STATUS_MESHING
    BED_MESH_CLEAR
    QUAD_GANTRY_LEVEL
    G28 Z
    _STATUS_READY

[gcode_macro PARK]
gcode:
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_minimum.x+50} Y{printer.toolhead.axis_maximum.y-30} Z{printer.toolhead.axis_maximum.z-150} F6000

