## Voron Design VORON2 350mm BigTreeTech OctoPus V1.0.1
[include mainsail.cfg]
[include toolchanger/toolchanger-include.cfg]
[include macros/macros.cfg]
[include macros/prime_lines.cfg]
[include macros/bedfans-dualcontrol.cfg]
# [include macros/Orbiter2_SmartSensor.cfg]

#####################################################################
#   Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 1000 #1300 #300 
max_accel: 4000 #4000 #46000  #3000
max_z_velocity: 500 #300
max_z_accel: 3000 #2500 #2000
square_corner_velocity: 5.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_39004E000250524B57333320-if00
restart_method: command

[virtual_sdcard]
path: /home/mjc/printer_data/gcodes
on_error_gcode:  CANCEL_PRINT

[exclude_object]
[input_shaper]
[display_status]
[pause_resume]
#[skew_correction]
[axis_twist_compensation]

# [rounded_path]
# resolution: 0.2 # the length of a circle approximation segments.
# replace_g0: False # Use at your own risk

# [force_move]
# enable_force_move: true

# [resonance_tester]
# accel_chip: adxl345 T0
# probe_points:
#     175, 175, 20

[idle_timeout]
timeout: 600

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop Sensorless
# [stepper_x]
# step_pin: PF13
# dir_pin: PF12
# enable_pin: !PF14
# rotation_distance: 40
# microsteps: 64
# full_steps_per_rotation:200
# endstop_pin: tmc5160_stepper_x:virtual_endstop
# position_min: 0
# position_endstop: 350
# position_max: 350
# homing_speed: 35
# homing_retract_dist: 0
# homing_positive_dir: true

# [tmc5160 stepper_x]
# cs_pin: PC4
# spi_software_miso_pin: PA6
# spi_software_mosi_pin: PA7
# spi_software_sclk_pin: PA5
# sense_resistor: 0.075
# diag1_pin: !PG6
# run_current: 2.5
# interpolate: false
# stealthchop_threshold: 0
# driver_SGT: 75 # 255 is most sensitive value, 0 is least sensitive

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 40 #50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
interpolate: false
run_current: 1.7 #1.4
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGTHRS: 50 # 255 is most sensitive value, 0 is least sensitive

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: -10
position_endstop: 345 #350
position_max: 345  #350
homing_speed: 75  #Max 100
homing_retract_dist: 5
homing_positive_dir: true


[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.7 #1.4
sense_resistor: 0.075
stealthchop_threshold: 0

# [stepper_y]
# step_pin: PG0
# dir_pin: PG1
# enable_pin: !PF15
# rotation_distance: 40
# microsteps: 64
# full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
# endstop_pin: PG9
# position_min: -10
# position_endstop: 350
# position_max: 350
# homing_speed: 75  #Max 100
# homing_retract_dist: 5
# homing_positive_dir: true

# [tmc5160 stepper_y]
# cs_pin: PD11
# spi_software_miso_pin: PA6
# spi_software_mosi_pin: PA7
# spi_software_sclk_pin: PA5
# sense_resistor: 0.075
# run_current: 2.5
# interpolate: false
# stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 365
homing_speed: 25 #25
second_homing_speed: 3
homing_retract_dist: 0

[tmc5160 stepper_z]
cs_pin: PC6
sense_resistor: 0.075
interpolate: false
run_current: 2
stealthchop_threshold: 0
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z1]
cs_pin: PC7
sense_resistor: 0.075
interpolate: false
run_current: 2
stealthchop_threshold: 0
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z2]
cs_pin: PF2
sense_resistor: 0.075
interpolate: false
run_current: 2
stealthchop_threshold: 0
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z3]
cs_pin: PE4
sense_resistor: 0.075
interpolate: false
run_current: 2
stealthchop_threshold: 0
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.64
min_temp: 0
max_temp: 120
pwm_cycle_time: 0.02

#####################################################################
#   Temperature and Fan Control
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[multi_pin my_controller_fan_pins]
pins: PA8, PD12, PD13

##  Controller fan - FAN2
[controller_fan controller_fan]
pin: multi_pin:my_controller_fan_pins
kick_start_time: 0.5
heater: heater_bed

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 100
# gcode_id: C

[fan_generic exhaust_fan]
pin: PE5
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.00004 # 25 kHz
hardware_pwm: True
#off_below:
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:

