## Voron Design VORON2 350mm BigTreeTech OctoPus V1.0.1 TMC2209 UART config

[include mainsail.cfg]
[include macro/bedfans-dualcontrol.cfg]
[include macro/Orbiter2_SmartSensor.cfg]

# tapchanger
[include macro/macros.cfg]
[include macro/homing.cfg] 
[include macro/tool_detection.cfg]
[include macro/toolchanger-2.4.cfg]
[include macro/toolchanger-leds.cfg]
[include macro/shell_command.cfg]
[include macro/prime_lines.cfg]

# Tool Heads
[include tools/Toolhead_T0.cfg]
[include tools/Toolhead_T1.cfg]
[include tools/Toolhead_T2.cfg]
[include tools/Toolhead_T3.cfg]
[include tools/Toolhead_T4.cfg]
[include tools/Toolhead_T5.cfg]

#####################################################################
#   Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 500  
max_accel: 3000             #Max 4000
max_z_velocity: 50          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_360051001150533850353920-if00
#restart_method: command

[virtual_sdcard]
path: /home/mjc/printer_data/gcodes
on_error_gcode:  CANCEL_PRINT

[exclude_object]
[input_shaper]
[display_status]
[pause_resume]

[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

[force_move]
enable_force_move: true

[resonance_tester]
accel_chip: adxl345 T0
probe_points:
    175, 175, 20

[idle_timeout]
timeout: 1800

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop Sensorless
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 20   # half of your rotation_distance for sensorless homing
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: PG6
driver_SGTHRS: 60 #255 most sensitive 

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: -5
position_endstop: 350
position_max: 350
homing_speed: 75  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
position_min: -5
position_max: 365
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.64
min_temp: 0
max_temp: 120
pwm_cycle_time: 0.02

#####################################################################
#   Temperature and Fan Control
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[multi_pin my_controller_fan_pins]
pins: PD12, PD13

##  Controller fan - FAN2
[controller_fan controller_fan]
pin: multi_pin:my_controller_fan_pins
kick_start_time: 0.5
heater: heater_bed

# [fan_generic exhaust_fan]
# pin: PA8
# max_power: 1.0
# shutdown_speed: 0.0
# kick_start_time: 5.0

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4
#min_temp: 0
#max_temp: 100

#####################################################################
#   LED Control
#####################################################################

[neopixel chamber]
pin: PB0
chain_count: 65
color_order: GRB

#####################################################################
#   Probe
#####################################################################

[bed_mesh]
speed: 350
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 320, 320
probe_count: 5, 5
bicubic_tension: 0.2
fade_start: 0.6
fade_end: 10.0
algorithm: bicubic

# [bed_mesh]
# algorithm: bicubic
# speed: 100
# mesh_min: 40, 40
# mesh_max: 310, 310
# probe_count: 5, 5

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   10,20
   10,335
   335,335
   335,20
# points:
#    50,25
#    50,275
#    300,275
#    300,25
speed: 350    #600 old
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0100   # 0.0075 old
max_adjust: 20 # old 15

