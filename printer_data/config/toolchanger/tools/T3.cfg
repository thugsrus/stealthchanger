[filament_switch_sensor filament_sensor_at_T3]
switch_pin: ^EBBT3:PB3
pause_on_runout: FALSE
runout_gcode:
  M118 Runout sensor at T3 reports: No filament Detected
insert_gcode:
  M118 Runout sensor at T3 reports: Filament Detected

