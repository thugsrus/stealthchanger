[mcu EBBT3]
canbus_uuid: 466fa657a517

[extruder3]
step_pin: EBBT3:PD0
dir_pin: EBBT3:PD1
enable_pin: !EBBT3:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400 
filament_diameter: 1.750
heater_pin: EBBT3: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT3: PA3 
max_power: 1.0 
min_temp: -50
max_temp: 310 
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
# Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder2 TARGET=245"
control=pid
pid_Kp=31.830
pid_Ki=4.161
pid_Kd=60.874
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder3]
uart_pin: EBBT3: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[fan_generic T3_partfan]
pin: EBBT3:PA1

[heater_fan T3_hotend_fan]
pin: EBBT3:PA0
heater: extruder3
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T3]
variable_active: 0
variable_color: ""
variable_tool_number: 3
gcode:
  SELECT_TOOL T=3
  {% set svf = printer.save_variables.variables %}
  # Grab the current tool number so we can remove any z offset that is present
  {% set z_offset_val = svf[ 't' + printer.toolchanger.tool_number|string + '_offset_z'] %}
  # Subtract the tool z_offset from the homing_origin, the remainder is any tweaked z offset
  {% set modified_z = printer.gcode_move.homing_origin.z|float|round(3) - z_offset_val|float|round(3) %}
  # Clear the offsets set by macros
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
  # Activate the selected tool
  SELECT_TOOL T={tool_number}
  # Apply the macro offsets, including modified z settings
  SET_GCODE_OFFSET X={svf[ 't' + tool_number|string + '_offset_x']|float|round(3)} Y={svf[ 't' + tool_number|string + '_offset_y']|float|round(3)} Z={svf[ 't' + tool_number|string + '_offset_z'] + modified_z} MOVE=1
  # Update the current tool variable in the save file
  SAVE_VARIABLE VARIABLE=current_tool VALUE={tool_number}

[tool T3]
tool_number: 3
detection_pin: !EBBT3:PB6
extruder: extruder3
fan: T3_partfan
############## GCODE OFFSETS ##############
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
############## PARK OFFSETS ##############
params_park_x: 139.2
params_park_y: -2
params_park_z: 340
############## INPUT SHAPER ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 31.6
params_input_shaper_damping_ratio_y: 0.01

[adxl345 T3]
cs_pin: EBBT3:PB12
spi_software_sclk_pin: EBBT3:PB10
spi_software_mosi_pin: EBBT3:PB11
spi_software_miso_pin: EBBT3:PB2
axes_map: x,z,y

[neopixel T3_leds]
pin: EBBT3:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T3_vars]
variable_logo_led_name:         "T3_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T3_leds"
variable_nozzle_idx:            "2,3"
gcode: