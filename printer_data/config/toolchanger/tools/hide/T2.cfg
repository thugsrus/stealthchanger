[mcu EBBT2]
canbus_uuid: b000ecb2f2dc
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -f ~/klipper/out/klipper.bin

[adxl345 T2]
cs_pin: EBBT2: PB12
spi_software_sclk_pin: EBBT2: PB10
spi_software_mosi_pin: EBBT2: PB11
spi_software_miso_pin: EBBT2: PB2
axes_map: x,z,y

[extruder2]
step_pin: EBBT2:PD0
dir_pin: EBBT2:PD1
enable_pin: !EBBT2:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBT2: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT2: PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder1 TARGET=245"
control=pid
pid_Kp=32.462
pid_Ki=4.243
pid_Kd=62.083

max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder2]
uart_pin: EBBT2: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan T2_hotend_fan]
pin: EBBT2: PA0
heater: extruder2
heater_temp: 50.0

[fan_generic T2_partfan]
pin: EBBT2: PA1

[gcode_macro T2]
variable_active: 0
variable_color: ""
variable_tool_number: 2
gcode:
  SELECT_TOOL T=2
  {% set svf = printer.save_variables.variables %}
  # Grab the current tool number so we can remove any z offset that is present
  {% set z_offset_val = svf[ 't' + printer.toolchanger.tool_number|string + '_offset_z'] %}
  # Subtract the tool z_offset from the homing_origin, the remainder is any tweaked z offset
  {% set modified_z = printer.gcode_move.homing_origin.z|float|round(3) - z_offset_val|float|round(3) %}
  # Clear the offsets set by macros
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
  # Activate the selected tool
  SELECT_TOOL T={tool_number}
  # Apply the macro offsets, including modified z settings
  SET_GCODE_OFFSET X={svf[ 't' + tool_number|string + '_offset_x']|float|round(3)} Y={svf[ 't' + tool_number|string + '_offset_y']|float|round(3)} Z={svf[ 't' + tool_number|string + '_offset_z'] + modified_z} MOVE=1
  # Update the current tool variable in the save file
  SAVE_VARIABLE VARIABLE=current_tool VALUE={tool_number}

[tool T2]
tool_number: 2
detection_pin: !EBBT2:PB6
extruder: extruder2
fan: T2_partfan
############## GCODE OFFSETS ##############
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
############## PARK OFFSETS ##############
params_park_x: 75
params_park_y: -2.3
params_park_z: 341
############## InputShaper ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50.8
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 32.0

############## LEDS ##############
[neopixel T2_leds]
pin: EBBT2:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T2_vars]
variable_logo_led_name:         "T2_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T2_leds"
variable_nozzle_idx:            "2,3"
gcode: