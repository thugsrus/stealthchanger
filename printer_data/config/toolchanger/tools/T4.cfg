[mcu EBBT4]
canbus_uuid: 7eba7fde40ff

[adxl345 T4]
cs_pin: EBBT4:PB12
spi_software_sclk_pin: EBBT4:PB10
spi_software_mosi_pin: EBBT4:PB11
spi_software_miso_pin: EBBT4:PB2
axes_map: x,z,y

[extruder4]
step_pin: EBBT4:PD0
dir_pin: EBBT4:PD1
enable_pin: !EBBT4:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: EBBT4: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT4:PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder4 TARGET=245"
control=pid
pid_Kp=31.176
pid_Ki=4.949
pid_Kd=49.103
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder4]
uart_pin: EBBT4: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[fan_generic T4_partfan]
pin: EBBT4:PA1

[heater_fan T4_hotend_fan]
pin: EBBT4:PA0
heater: extruder4
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T4]
variable_active: 0
variable_color: ""
gcode:
  SELECT_TOOL T=4

[tool T4]
tool_number: 4
detection_pin: !EBBT4:PB6
extruder: extruder4
fan: T4_partfan
############## GCODE OFFSETS ##############
gcode_x_offset:  0.371875 #0.275000 #0.159375 #0.300000
gcode_y_offset: -0.746875 #-0.768750 #-0.681250 #-0.659375 #-0.782813
gcode_z_offset: -0.86625 #-0.850 #-0.83625 #-0.876250 #-0.111250 #-0.111250 #-0.132500 #-0.208750 #-0.161250 #-0.127500
############## PARK SETTING ##############
params_park_x: 270.2 #268.50
params_park_y: -1.7 #-1.3
params_park_z: 340
############## INPUT SHAPER ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.2
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 31.6
params_input_shaper_damping_ratio_y: 0.01  

[neopixel T4_leds]
pin: EBBT4:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T1_vars]
variable_logo_led_name:         "T4_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T4_leds"
variable_nozzle_idx:            "2,3"
gcode: