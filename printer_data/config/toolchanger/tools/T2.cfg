[mcu EBBT2]
canbus_uuid: 466fa657a517

[extruder2]
step_pin: EBBT2:PD0
dir_pin: EBBT2:PD1
enable_pin: !EBBT2:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400 
filament_diameter: 1.750
heater_pin: EBBT2: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT2: PA3 
max_power: 1.0 
min_temp: -50
max_temp: 310 
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
# Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder2 TARGET=245"
control=pid
pid_Kp=31.830
pid_Ki=4.161
pid_Kd=60.874
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder2]
uart_pin: EBBT2: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[fan_generic T2_partfan]
pin: EBBT2:PA1
max_power: 1.0          # Allow full power (100% duty cycle)
kick_start_time: 0.5    # Delivers full voltage for 0.5s to help twin blowers spin up
off_below: 0.60         # Prevents stalling by turning fans off if speed is under 10%
cycle_time: 0.010       # 100Hz PWM frequency (reduces high-pitched motor whine)
hardware_pwm: False     # Employs software PWM (preferred for typical 4010 blowers)

[heater_fan T2_hotend_fan]
pin: EBBT2:PA0
heater: extruder2
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T2]
variable_color: ""
gcode:
  SELECT_TOOL T=2

[tool T2]
tool_number: 2
detection_pin: !EBBT2:PB6
extruder: extruder2
fan: T2_partfan
############## GCODE OFFSETS ##############
# gcode_x_offset: 0
# gcode_y_offset: 0
# gcode_z_offset: 0
############## PARK OFFSETS ##############
params_park_x: 139.2
params_park_y: -1.50 #-1.60
params_park_z: 340
############## INPUT SHAPER ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 31.6
params_input_shaper_damping_ratio_y: 0.01

[adxl345 T2]
cs_pin: EBBT2:PB12
spi_software_sclk_pin: EBBT2:PB10
spi_software_mosi_pin: EBBT2:PB11
spi_software_miso_pin: EBBT2:PB2
axes_map: x,z,y

[neopixel T2_leds]
pin: EBBT2:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T2_vars]
variable_logo_led_name:         "T2_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T2_leds"
variable_nozzle_idx:            "2,3"
gcode:


[filament_switch_sensor filament_sensor_T2]
switch_pin: ^feeder:PG15
pause_on_runout: FALSE
runout_gcode:
  SET_TOOL_FILAMENT_STATUS T=2 HAS_FILAMENT=0
  M118 Runout sensor T2 reports: Runout
  #FAILOVER_CHECK T=2
insert_gcode:
  SET_TOOL_FILAMENT_STATUS T=2 HAS_FILAMENT=1
  M118 Runout sensor T2 reports: Filament Detected
  LOAD_ANY_TOOL T=2 S=30 D=1700  # 1400mm is a reasonable default Bowden length — adjust to match your tube

