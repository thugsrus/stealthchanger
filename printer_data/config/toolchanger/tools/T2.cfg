[filament_switch_sensor filament_sensor_at_T2]
switch_pin: ^EBBT2:PB3
pause_on_runout: FALSE
runout_gcode:
  M118 Runout sensor at T2 reports: No filament Detected
insert_gcode:
  M118 Runout sensor at T2 reports: Filament Detected