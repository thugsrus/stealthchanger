[mcu EBBT5]
canbus_uuid: 2ab2b2523291

[adxl345 T5]
cs_pin: EBBT5:PB12
spi_software_sclk_pin: EBBT5:PB10
spi_software_mosi_pin: EBBT5:PB11
spi_software_miso_pin: EBBT5:PB2
axes_map: x,z,y

[extruder5]
step_pin: EBBT5:PD0
dir_pin: EBBT5:PD1
enable_pin: !EBBT5:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: EBBT5: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT5: PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040 # Smooth advancement time - the default value is 0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder5 TARGET=245"
control=pid
pid_Kp=26.164
pid_Ki=3.291
pid_Kd=52.001

max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder5]
uart_pin: EBBT5: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[fan_generic T5_partfan]
pin: EBBT5:PA1
max_power: 1.0          # Allow full power (100% duty cycle)
kick_start_time: 0.5    # Delivers full voltage for 0.5s to help twin blowers spin up
off_below: 0.60         # Prevents stalling by turning fans off if speed is under 10%
cycle_time: 0.010       # 100Hz PWM frequency (reduces high-pitched motor whine)
hardware_pwm: False     # Employs software PWM (preferred for typical 4010 blowers)

[heater_fan T5_hotend_fan]
pin: EBBT5:PA0
heater: extruder5
heater_temp: 50.0
kick_start_time: 0.5

[gcode_macro T5]
variable_color: ""
gcode:
  SELECT_TOOL T=5

[tool T5]
tool_number: 5
detection_pin: !EBBT5:PB6
extruder: extruder5
fan: T5_partfan
params_has_filament_sensor: True
############## GCODE OFFSETS ##############
# gcode_x_offset: 0
# gcode_y_offset: 0
# gcode_z_offset: 0
############## PARK SETTING ##############
params_park_x: 334.30 #333.60 #334.00
params_park_y: -0.5
params_park_z: 341
############## InputShaper ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.2
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 31.6
params_input_shaper_damping_ratio_y: 0.01  

[neopixel T5_leds]
pin: EBBT5:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T5_vars]
variable_logo_led_name:         "T5_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T5_leds"
variable_nozzle_idx:            "2,3"
gcode:


[filament_switch_sensor filament_sensor_T5]
switch_pin: ^pico:gpio28
pause_on_runout: FALSE
runout_gcode:
  SET_TOOL_FILAMENT_STATUS T=5 HAS_FILAMENT=0
  M118 Runout sensor T5 reports: Runout
  #FAILOVER_CHECK T=5
insert_gcode:
  SET_TOOL_FILAMENT_STATUS T=5 HAS_FILAMENT=1
  M118 Runout sensor T5 reports: Filament Detected
  LOAD_ANY_TOOL T=5 S=30 D=1400  # 1400mm is a reasonable default Bowden length — adjust to match your tube

