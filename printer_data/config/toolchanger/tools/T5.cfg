[filament_switch_sensor filament_sensor_at_T5]
switch_pin: ^EBBT5:PB3
pause_on_runout: FALSE
runout_gcode:
  M118 Runout sensor at T5 reports: No filament Detected
insert_gcode:
  M118 Runout sensor at T5 reports: Filament Detected