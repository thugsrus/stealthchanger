[mcu EBBT0]
canbus_uuid: ed2173cf5fdc

[adxl345 T0]
cs_pin: EBBT0: PB12
spi_software_sclk_pin: EBBT0: PB10
spi_software_mosi_pin: EBBT0: PB11
spi_software_miso_pin: EBBT0: PB2
axes_map: x,z,y

[extruder]
step_pin: EBBT0:PD0
dir_pin: EBBT0:PD1
enable_pin: !EBBT0:PD2
microsteps: 16
full_steps_per_rotation: 200 
rotation_distance: 4.637 
nozzle_diameter: 0.400 
filament_diameter: 1.750
heater_pin: EBBT0: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT0: PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.032
pressure_advance_smooth_time:0.032 # Smooth advancement time - the default value is 0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder TARGET=245
control=pid
pid_Kp=26.164
pid_Ki=3.291
pid_Kd=52.001
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBBT0: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan T0_hotend_fan]
pin: EBBT0: PA0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic T0_partfan]
pin: EBBT0:PA1
max_power: 1.0          # Allow full power (100% duty cycle)
kick_start_time: 0.5    # Delivers full voltage for 0.5s to help twin blowers spin up
off_below: 0.60         # Prevents stalling by turning fans off if speed is under 10%
cycle_time: 0.010       # 100Hz PWM frequency (reduces high-pitched motor whine)
hardware_pwm: False     # Employs software PWM (preferred for typical 4010 blowers)

[gcode_macro T0]
variable_color: ""
gcode:
  SELECT_TOOL T=0
  
[tool T0]
tool_number: 0
detection_pin: !EBBT0:PB6
gcode_x_offset: 0 # allways 0 for T0
gcode_y_offset: 0 # allways 0 for T0
gcode_z_offset: 0
extruder: extruder
fan: T0_partfan
############## PARK OFFSETS ##############
params_park_x: 9.60 #10.10
params_park_y: -2.20 #-2
params_park_z: 341
############## InputShaper ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50.6
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 33.0
params_input_shaper_damping_ratio_y: 0.01

[neopixel T0_leds]
pin: EBBT0:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T0_vars]
variable_logo_led_name:         "T0_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T0_leds"
variable_nozzle_idx:            "2,3"
gcode:

[filament_switch_sensor filament_sensor_T0]
switch_pin: ^pico:gpio16
pause_on_runout: FALSE
runout_gcode:
  SET_TOOL_FILAMENT_STATUS T=0 HAS_FILAMENT=0
  M118 Runout sensor T0 reports: Runout
#  FAILOVER_CHECK T=0
insert_gcode:
  SET_TOOL_FILAMENT_STATUS T=0 HAS_FILAMENT=1
  M118 Runout sensor T0 reports: Filament Detected
  LOAD_ANY_TOOL T=0 S=30 D=1500  # 1400mm is a reasonable default Bowden length — adjust to match your tube

