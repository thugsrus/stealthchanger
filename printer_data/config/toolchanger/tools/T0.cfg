[filament_switch_sensor filament_sensor_at_T0]
switch_pin: ^EBBT0:PB3
pause_on_runout: FALSE
runout_gcode:
  M118 Runout sensor at T0 reports: No filament Detected
insert_gcode:
  M118 Runout sensor at T0 reports: Filament Detected

