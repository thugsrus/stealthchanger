[filament_switch_sensor filament_sensor_at_T1]
switch_pin: ^EBBT1:PB9
pause_on_runout: FALSE
runout_gcode:
  M118 Runout sensor at T1 reports: No filament Detected
insert_gcode:
  M118 Runout sensor at T1 reports: Filament Detected