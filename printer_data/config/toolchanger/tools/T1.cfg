[mcu EBBT1]
canbus_uuid: b000ecb2f2dc
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -f ~/klipper/out/klipper.bin

[adxl345 T1]
cs_pin: EBBT1: PB12
spi_software_sclk_pin: EBBT1: PB10
spi_software_mosi_pin: EBBT1: PB11
spi_software_miso_pin: EBBT1: PB2
axes_map: x,z,y

[extruder1]
step_pin: EBBT1:PD0
dir_pin: EBBT1:PD1
enable_pin: !EBBT1:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBT1: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBT1: PA3
max_power: 1.0
min_temp: -50
max_temp: 310
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time:0.040
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder1 TARGET=245"
control=pid
pid_Kp=32.462
pid_Ki=4.243
pid_Kd=62.083

max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
max_extrude_cross_section: 5

[tmc2209 extruder1]
uart_pin: EBBT1: PA15
interpolate: true
run_current: 0.85
hold_current:0.100
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan T1_hotend_fan]
pin: EBBT1: PA0
heater: extruder1
heater_temp: 50.0

[fan_generic T1_partfan]
pin: EBBT1: PA1
max_power: 1.0          # Allow full power (100% duty cycle)
kick_start_time: 0.5    # Delivers full voltage for 0.5s to help twin blowers spin up
off_below: 0.60         # Prevents stalling by turning fans off if speed is under 10%
cycle_time: 0.010       # 100Hz PWM frequency (reduces high-pitched motor whine)
hardware_pwm: False     # Employs software PWM (preferred for typical 4010 blowers)

[gcode_macro T1]
variable_color: ""
gcode:
  SELECT_TOOL T=1

[tool T1]
tool_number: 1
detection_pin: !EBBT1:PB6
extruder: extruder1
fan: T1_partfan
############## GCODE OFFSETS ##############
# gcode_x_offset: 0
# gcode_y_offset: 0
# gcode_z_offset: 0
############## PARK OFFSETS ##############
params_park_x: 75.2
params_park_y: -2.2 #-2.1
params_park_z: 341
############## InputShaper ##############
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50.8
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 32.0

############## LEDS ##############
[neopixel T1_leds]
pin: EBBT1:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T1_vars]
variable_logo_led_name:         "T1_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T1_leds"
variable_nozzle_idx:            "2,3"
gcode:


[filament_switch_sensor filament_sensor_T1]
switch_pin: ^pico:gpio17
pause_on_runout: FALSE
runout_gcode:
  SET_TOOL_FILAMENT_STATUS T=1 HAS_FILAMENT=0
  M118 Runout sensor T1 reports: Runout
  #FAILOVER_CHECK T=1
insert_gcode:
  SET_TOOL_FILAMENT_STATUS T=1 HAS_FILAMENT=1
  M118 Runout sensor T1 reports: Filament Detected
  LOAD_ANY_TOOL T=1 S=30 D=1400  # 1400mm is a reasonable default Bowden length — adjust to match your tube

# [filament_motion_sensor encoder_sensor_T1]
