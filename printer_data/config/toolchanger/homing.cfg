#Cartogrpaher probe
[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_614e_33001F001943303854303720-if00
restart_method: command

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 35.1
# backlash_comp: 0.00592
# sensor: cartographer
# sensor_alt: carto
# mode: touch
# mesh_runs: 2
# scanner_touch_threshold = 1500
# scanner_touch_speed = 1
# scanner_touch_z_offset = 0.05
verbose: no

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA3 # For Cartographer V3
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[cartographer touch]
samples: 3
max_samples: 6
UNSAFE_max_touch_temperature: 155

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
  50,10
  50,275
  300,275
  300,10
speed: 400 #200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 20 
   
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2.0  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}

[bed_mesh]
zero_reference_position: 175, 175
speed: 400 #300
horizontal_move_z: 10
mesh_min: 15, 30
mesh_max: 335, 335
# mesh_min: 10, 54
# mesh_max: 340, 330
probe_count: 10, 10
adaptive_margin: 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10

# [temperature_sensor cartographer]
# sensor_type: temperature_mcu
# sensor_mcu: cartographer
# min_temp: 5
# max_temp: 105

[gcode_macro HOME]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}

