######################### SEX BALL #########################

[tools_calibrate]
pin: ^PG11
travel_speed: 100  # mms to travel sideways for XY probing
spread: 3.75  # mms to travel down from top for XY probing
lower_z: 0.2  # The speed (in mm/sec) to move tools down onto the probe
speed: 5  # The speed (in mm/sec) to retract between probes
lift_speed: 4  # Z Lift after probing done, should be greater than any Z variance between tools
final_lift_z: 4 
sample_retract_dist:2
samples_tolerance:0.05
samples:5
samples_result: median # median, average
# Settings for nozzle probe calibration - optional.

probe: probe # name of the nozzle probe to use
trigger_to_bottom_z: 0.25 # Offset from probe trigger to vertical motion bottoms out. 
# decrease if the nozzle is too high, increase if too low.


[gcode_macro _CALIBRATE_MOVE_OVER_PROBE]
gcode:
    BED_MESH_CLEAR
    G0 Z9 F10000 # UPDATE THIS WITH YOUR POSITION
    G0 X232.31 Y-2.15 F10000  # UPDATE THIS WITH YOUR POSITION

[gcode_macro CALIBRATE_TOOL_OFFSETS]
gcode:
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set names = printer.toolchanger.tool_names %}
    {% set temp = 150 %}
    #M190 S95
    # Heat up all the hotends
    {% for tool in tools %}
      M104 S{temp} T{tool}
    {% endfor %}

    # Tool 0
    M109 S{temp} T0
    SELECT_TOOL T={tools[0]}  RESTORE_AXIS=XYZ
    _CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    M104 S0
    {% for tool in tools[1:] %}
        SELECT_TOOL T={tool}  RESTORE_AXIS=XYZ
        TOOL_CALIBRATE_TOOL_OFFSET
        _SAVE_TOOL_OFFSET T={tool}
        M104 S0
    {% endfor %}

    # Finish up
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XZ
    TURN_OFF_HEATERS

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
gcode:    
    CALIBRATE_MOVE_OVER_PROBE
    M109 S150    
    TOOL_LOCATE_SENSOR
    TOOL_CALIBRATE_PROBE_OFFSET
    M104 S0


[gcode_macro _SAVE_TOOL_OFFSET]
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset VALUE="{printer.tools_calibrate.last_x_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset VALUE="{printer.tools_calibrate.last_y_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_z_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset

[gcode_macro _SAVE_Z_TOOL_OFFSET]
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_z_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset

######################### Cartographer #########################

[gcode_macro GET_Z_OFFSET]
description: Probe one or all tools. Usage: GET_Z_OFFSETS TOOL=3
gcode:
  # 1. Determine which tools to run.
  {% set target_tool = params.TOOL|default(0)|int %}
  {% if target_tool > 0 %}
    {% set tool_list = [target_tool] %}
  {% else %}
    {% set tool_list = [1,2,3,4,5] %}
  {% endif %}

  SET_GCODE_OFFSET Z=0
  M118 Heating Bed to 60
  M190 S60                
  NOZZLE_LIGHTS_ON
  G28                     
  QUAD_GANTRY_LEVEL
  
  # 2. Pre-heat tools
  M104 T0 S150
  {% for i in tool_list %}
    M104 T{i} S150
  {% endfor %}

  T0
  M109 T0 S150
  CLEAN_NOZZLE
  _CLIENT_LINEAR_MOVE X=175 Y=175 Z=5 F=12000 ABSOLUTE=1
  CARTOGRAPHER_TOUCH_HOME

  # 3. Loop and probe
  {% for i in tool_list %}
    {% if i > 0 and i < 6 %}
      T{i}
      M109 T{i} S150       
      CLEAN_NOZZLE
      _CLIENT_LINEAR_MOVE X=175 Y=175 F=12000 ABSOLUTE=1
      CARTOGRAPHER_TOUCH_PROBE
      _RECORD_CARTO_Z_OFFSET T={i}
      M400
    {% endif %}
  {% endfor %}

  T0
  _CLIENT_LINEAR_MOVE X=175 Y=175 F=12000 ABSOLUTE=1
  NOZZLE_LIGHTS_OFF
  TURN_OFF_HEATERS

[gcode_macro GET_ALL_Z_OFFSETS]
gcode:
  SET_GCODE_OFFSET Z=0
  M118 Heating Bed to 60
  M190 S60                # Wait for bed
  NOZZLE_LIGHTS_ON
  G28                     # Home
  QUAD_GANTRY_LEVEL
  T0
  
  # Heat all tools to 150C (T0-T5)
  {% for i in range(6) %}
    M104 T{i} S150
  {% endfor %}
  M109 T0 S150            # Ensure T0 is at temp
  CLEAN_NOZZLE
  _CLIENT_LINEAR_MOVE X=175 Y=175 Z=7 F=12000 ABSOLUTE=1
  CARTOGRAPHER_TOUCH_HOME
  
  # Loop through T1 to T5 for Probing
  {% for i in range(1, 6) %}
    T{i}
    CLEAN_NOZZLE
    _CLIENT_LINEAR_MOVE X=175 Y=175 Z=7 F=12000 ABSOLUTE=1
    CARTOGRAPHER_TOUCH_PROBE
    
    # Process the active tool's dynamic Cartographer result
    _RECORD_CARTO_Z_OFFSET T={i}
  {% endfor %}
  
  # Return to T0
  T0
  _CLIENT_LINEAR_MOVE X=175 Y=175 F=12000 ABSOLUTE=1
  NOZZLE_LIGHTS_OFF
  TURN_OFF_HEATERS

[gcode_macro _RECORD_CARTO_Z_OFFSET]
gcode:
  # Pulls the fresh touch result from the Cartographer module
  {% set live_z = printer.cartographer.touch.last_z_result %}
  
  M118 Tool T{params.T} measured Z offset: {live_z}
  
  SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE={live_z}
  SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset
